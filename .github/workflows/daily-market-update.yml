name: 🤖 AratBazar Bi-Hourly Automated Market Intelligence & News

on:
  schedule:
    # Runs every 2 hours at minute 0 (00:00, 02:00, 04:00, 06:00, ..., 22:00 UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions UI

jobs:
  auto-publish:
    name: Fetch Live News & Publish Intelligence Dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📡 Fetch Real Feeds & Synthesize Winning Products & Market Intelligence
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 AratBazar Auto-Publisher Running"
          echo "📅 UTC: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          node scripts/auto-product-hunter.js
          node scripts/auto-news-generator.js
          node scripts/auto-ai-generator.js

      - name: 📤 Commit & Push New Products, News & Market Data
        run: |
          git config --global user.name "AratBazar Bot"
          git config --global user.email "bot@aratbazar.com"
          
          git add src/data/productsData.ts src/data/newsData.ts src/data/marketData.ts src/data/aiModelsData.ts
          
          if git diff --staged --quiet; then
            echo "ℹ️ No new updates needed — existing archive is already current"
          else
            git commit -m "🤖 Auto: Daily winning products & market intelligence update — $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
            echo "✅ Successfully published new winning products & intelligence to GitHub & Vercel!"
          fi

      - name: 🔔 Status Summary
        run: |
          echo "✨ AratBazar Bi-Hourly cycle finished successfully."
          echo "🌐 Live at https://aratbazar.com"
