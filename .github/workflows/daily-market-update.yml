name: 🤖 AratBazar Daily AI Market Intelligence Update

on:
  schedule:
    # Runs every day at 06:00 UTC = 12:00 Noon Bangladesh Time (BST = UTC+6)
    # This ensures fresh content is live before Asian & European market sessions
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force full content regeneration (true/false)'
        required: false
        default: 'true'

jobs:
  generate-and-deploy:
    name: Generate Daily Market Intelligence
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🤖 Generate Daily AI Market Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Starting AratBazar Daily Content Generation"
          echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          node scripts/generate-daily-content.js

      - name: 🔨 Verify Next.js Build
        run: |
          echo "Building Next.js to verify generated content compiles correctly..."
          npm run build
          echo "✅ Build successful!"

      - name: 📤 Commit & Push Updated Market Data
        run: |
          git config --global user.name "AratBazar Intelligence Bot"
          git config --global user.email "bot@aratbazar.com"
          
          # Check if any data files changed
          git add src/data/newsData.ts src/data/marketData.ts src/data/economicCalendar.ts
          
          if git diff --staged --quiet; then
            echo "ℹ️  No data changes detected — skipping commit"
          else
            ARTICLE_COUNT=$(git diff --staged --stat | grep "newsData" | wc -l)
            git commit -m "🤖 Auto: Daily market intelligence update — $(date -u '+%Y-%m-%d')

Generated by AratBazar AI Content Bot
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
• Fresh market analysis articles generated
• Live market data snapshot updated
• Economic calendar events refreshed
• SEO-optimized content for Google ranking

[skip ci]"
            git push origin main
            echo "✅ Successfully pushed daily market update!"
          fi

      - name: 🔔 Deployment Summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ AratBazar Daily Update Complete!"
          echo "🌐 Vercel will auto-deploy within 2-3 minutes"
          echo "🔗 Live site: https://aratbazar.com"
          echo "📊 Vercel dashboard: https://vercel.com/dashboard"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
