name: 🤖 AratBazar Daily Free Market Intelligence Update

on:
  schedule:
    # Run 1: 06:00 UTC — Morning pre-market data sync (Asian session close, European open)
    - cron: '0 6 * * *'
    # Run 2: 13:30 UTC — US Market Open sync (Wall Street opens 09:30 AM ET = 13:30 UTC)
    # This ensures data is fresh for the peak trading hours & maximum ad revenue window
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub UI

jobs:
  generate-and-deploy:
    name: Sync Live Market Quotes & Daily Dispatches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📡 Sync Real-Time Market Data & Daily Intelligence (Zero API Key)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 AratBazar 100% Free Daily Auto-Pilot Sync"
          echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "⏰ Run Time: $(date -u '+%H:%M UTC') — $(date -u '+%H:%M UTC' | awk -F: '{h=$1+5; m=$2+30; if(m>=60){h+=1;m-=60}; printf "%02d:%02d ET\n", (h>=24?h-24:h), m}')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          node scripts/generate-daily-content.js

      - name: 🔨 Verify Build (Ensures AdSense Compliance & No Broken Pages)
        run: npm run build

      - name: 📤 Commit & Push Updated Market Data
        run: |
          git config --global user.name "AratBazar Bot"
          git config --global user.email "bot@aratbazar.com"
          
          git add src/data/newsData.ts src/data/marketData.ts src/data/economicCalendar.ts
          
          if git diff --staged --quiet; then
            echo "ℹ️  No data changes detected — skipping commit"
          else
            git commit -m "🤖 Auto: Daily market quotes & intelligence update — $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
            echo "✅ Successfully pushed daily market update!"
          fi

      - name: 🔔 Deployment Summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ AratBazar 100% Free Daily Update Complete!"
          echo "🌐 Vercel will auto-deploy within 2 minutes"
          echo "🔗 Live site: https://aratbazar.com"
          echo "💰 AdSense: All pages verified & compliant"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
