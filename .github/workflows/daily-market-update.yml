name: 🤖 AratBazar Daily Free Market Intelligence Update

on:
  schedule:
    # Runs every day at 06:00 UTC = 12:00 Noon Bangladesh Time (BST = UTC+6)
    # 100% Free • Zero API Keys Required • Zero Cost Forever
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub UI

jobs:
  generate-and-deploy:
    name: Sync Live Market Quotes & Daily Dispatches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📡 Sync Real-Time Market Data & Daily Intelligence (Zero API Key)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 AratBazar 100% Free Daily Auto-Pilot Sync"
          echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          node scripts/generate-daily-content.js

      - name: 🔨 Verify Build
        run: npm run build

      - name: 📤 Commit & Push Updated Market Data
        run: |
          git config --global user.name "AratBazar Bot"
          git config --global user.email "bot@aratbazar.com"
          
          git add src/data/newsData.ts src/data/marketData.ts src/data/economicCalendar.ts
          
          if git diff --staged --quiet; then
            echo "ℹ️  No data changes detected — skipping commit"
          else
            git commit -m "🤖 Auto: Daily market quotes & intelligence update — $(date -u '+%Y-%m-%d') [skip ci]"
            git push origin main
            echo "✅ Successfully pushed daily market update!"
          fi

      - name: 🔔 Deployment Summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ AratBazar 100% Free Daily Update Complete!"
          echo "🌐 Vercel will auto-deploy within 2 minutes"
          echo "🔗 Live site: https://aratbazar.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
